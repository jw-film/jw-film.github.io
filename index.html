<body>
<div id="app"><noscript><p class="nojs">이 페이지는 JavaScript가 필요합니다.</p></noscript></div>
<script src="assets/render.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var previewed = false;
  var first = true;
  function show(d) {
    window.JWRender.mount(d, app);
    // 내용이 나중에 그려지므로, #work 같은 주소로 들어와도 해당 위치로 이동
    if (first && location.hash.length > 1 && window.parent === window) {
      var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (t) t.scrollIntoView();
    }
    first = false;
  }
  // 관리자 페이지의 실시간 미리보기 (같은 사이트에서 온 메시지만 허용)
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'jw-preview') { previewed = true; show(e.data.data); }
    if (e.data.type === 'jw-scroll') {
      var el = document.getElementById(e.data.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'jw-ready' }, location.origin);
  fetch('content.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { if (!previewed) show(d); })
    .catch(function () { app.innerHTML = '<p style="padding:120px 20px;text-align:center;color:#b4b4b4">내용을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>'; });
})();
</script>
</body>
